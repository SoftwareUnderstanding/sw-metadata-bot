name: 'SW Metadata Bot - Run Pipeline'
description: 'Run analysis and optionally publish issues from a config'
author: 'Tom François'

inputs:
  config-file:
    description: 'Path to configuration JSON file'
    required: true
  snapshot-tag:
    description: 'Optional snapshot tag override (for example 20260312)'
    required: false
    default: ''
  dry-run:
    description: 'If true, run analysis only; if false, run analysis then publish'
    required: false
    default: 'true'
  previous-report:
    description: 'Optional path to previous report.json for incremental handling'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync

    - name: Run analysis
      shell: bash
      run: |
        set -euo pipefail

        args=(
          run-analysis
          --config-file "${{ inputs.config-file }}"
        )

        if [[ "${{ inputs.snapshot-tag }}" != "" ]]; then
          args+=(--snapshot-tag "${{ inputs.snapshot-tag }}")
        fi

        if [[ "${{ inputs.previous-report }}" != "" ]]; then
          args+=(--previous-report "${{ inputs.previous-report }}")
        fi

        uv run sw-metadata-bot "${args[@]}"

    - name: Resolve analysis snapshot
      id: resolve-analysis-root
      shell: bash
      run: |
        set -euo pipefail

        analysis_root=$(uv run python - <<'PY'
        import json
        from pathlib import Path

        config_file = Path("${{ inputs.config-file }}")
        with open(config_file, encoding="utf-8") as f:
            data = json.load(f)

        outputs = data.get("outputs", {}) if isinstance(data, dict) else {}
        root_dir = outputs.get("root_dir", "outputs")
        run_name = outputs.get("run_name")
        if not run_name:
            community = data.get("community", {}) if isinstance(data, dict) else {}
            run_name = community.get("name") or config_file.stem

        run_root = Path(root_dir) / run_name
        if not run_root.exists():
            raise SystemExit(f"Run root not found: {run_root}")

        requested = "${{ inputs.snapshot-tag }}".strip()
        candidates = [p for p in run_root.iterdir() if p.is_dir()]
        if requested:
            prefixed = [
                p
                for p in candidates
                if p.name == requested or p.name.startswith(f"{requested}_")
            ]
            if prefixed:
                candidates = prefixed

        if not candidates:
            raise SystemExit(f"No snapshot folders found under: {run_root}")

        latest = sorted(candidates, key=lambda p: p.name)[-1]
        print(latest)
        PY
        )

        echo "analysis-root=$analysis_root" >> "$GITHUB_OUTPUT"

    - name: Publish issues
      if: ${{ inputs.dry-run != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        uv run sw-metadata-bot publish --analysis-root "${{ steps.resolve-analysis-root.outputs.analysis-root }}"