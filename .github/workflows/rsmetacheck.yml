name: RsMetaCheck Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled] # Needed to catch label changes
 

jobs:
  analyze-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Determine Environment
        id: check_label
        run: |
          if echo "${{ toJson(github.event.pull_request.labels.*.name) }}" | grep -q "prerelease"; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi
          echo "Explicit input of rs-metacheck-action"
          echo "input: $RSMETACHECK_INPUT"
          echo "branch: $GITHUB_REF"
          echo "pitfalls_output: $RSMETACHECK_PITFALLS_OUTPUT"
          echo "verbose: $RSMETACHECK_VERBOSE"
          echo "config: $RSMETACHECK_CONFIG_FILE"

      - name: Run RSMetacheck
        uses: SoftwareUnderstanding/rs-metacheck-action@0.3.4
        with:
          input: "https://github.com/SoftwareUnderstanding/sw-metadata-bot"
          branch: $GITHUB_REF
          pitfalls_output: ./pitfalls_output
          verbose: true
          config: "/.github/workflows/rsmetacheck_config.toml"
          config_profile: ${{ env.IS_PRERELEASE == 'true' && 'release' || 'unstable' }}